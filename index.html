<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Fire Dashboard</title>
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    #panel {
      position: absolute; top: 12px; left: 12px; width: 280px;
      padding: 12px 16px; background: white; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    #panel h1 { margin: 0 0 8px; font-size: 20px; }
    #panel p { margin: 6px 0; font-size: 14px; }
    #count { font-size: 32px; font-weight: bold; color: #d7301f; }
    .small { color: #555; font-size: 12px !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Daily Fire Dashboard</h1>
    <p id="description">Active fire detections in the past 24 hours.</p>
    <p><span id="count">-</span> fires</p>
    <p class="small">Last updated: <span id="updated">-</span></p>
    <p class="small">
      Data source: <a href="https://firms.modaps.eosdis.nasa.gov/" target="_blank">NASA FIRMS</a>
      (MODIS and VIIRS NRT). Boundary: <a href="https://www.geoboundaries.org/" target="_blank">geoBoundaries</a>
      via <a href="https://fieldmaps.io/" target="_blank">FieldMaps</a> (CC BY 4.0).
    </p>
  </div>

  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          imagery: {
            type: 'raster',
            tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
            tileSize: 256,
            maxzoom: 19,
            attribution: 'Powered by Esri | Esri, Maxar, Earthstar Geographics, and the GIS User Community'
          }
        },
        layers: [{ id: 'imagery', type: 'raster', source: 'imagery' }]
      },
      center: [0, 0],
      zoom: 1
    });

    map.on('load', async () => {
      // Load the AOI and use its name in the description
      const aoi = await fetch('data/aoi.geojson').then(r => r.json());
      const props = aoi.features[0].properties;
      document.getElementById('description').textContent =
        `Active fire detections in ${props.adm2_name}, ${props.adm1_name} in the past 24 hours.`;

      // Load the fires. The file's Last-Modified header tells us when it was last written.
      const response = await fetch('data/fires.geojson');
      const fires = await response.json();
      document.getElementById('count').textContent = fires.features.length;
      document.getElementById('updated').textContent =
        new Date(response.headers.get('Last-Modified')).toLocaleString();

      map.addSource('aoi', { type: 'geojson', data: aoi });
      map.addLayer({
        id: 'aoi-outline',
        type: 'line',
        source: 'aoi',
        paint: { 'line-color': 'white', 'line-width': 2 }
      });

      map.addSource('fires', { type: 'geojson', data: fires });
      map.addLayer({
        id: 'fires',
        type: 'circle',
        source: 'fires',
        paint: {
          'circle-radius': 5,
          'circle-color': '#d7301f',
          'circle-stroke-color': 'white',
          'circle-stroke-width': 1
        }
      });

      // Zoom to the AOI
      const geometry = aoi.features[0].geometry;
      const points = geometry.type === 'Polygon'
        ? geometry.coordinates.flat(1)
        : geometry.coordinates.flat(2);
      const bounds = new maplibregl.LngLatBounds();
      points.forEach(p => bounds.extend(p));
      map.fitBounds(bounds, { padding: 40 });
    });
  </script>
</body>
</html>
