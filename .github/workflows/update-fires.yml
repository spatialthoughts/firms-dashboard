name: update-fires

on:
  schedule:
    - cron: '17 */12 * * *'   # every 12 hours, UTC
  workflow_dispatch:           # allows running it manually from the Actions tab

permissions:
  contents: write              # needed to commit the updated data file

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install geopandas

      - run: python 03_update_fires.py
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

      - name: Commit the updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fires.geojson
          git diff --staged --quiet || git commit -m 'Update fire detections'
          git push
